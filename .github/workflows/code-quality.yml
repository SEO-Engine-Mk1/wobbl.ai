name: Code Quality

on:
  pull_request:
    branches: [ wobbl.ai, staging ]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: latest

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
        
    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile
        
    - name: Check code formatting
      run: |
        pnpm exec prettier --check "src/**/*.{ts,tsx,js,jsx}"
        
    - name: Run ESLint
      run: pnpm run lint
        
    - name: Check for console.log statements
      run: |
        if grep -r "console.log" src --exclude-dir=node_modules --exclude-dir=.next; then
          echo "❌ console.log statements found. Please remove them."
          exit 1
        fi
        
    - name: Check for TODO comments
      run: |
        todos=$(grep -r "TODO\|FIXME\|HACK" src --exclude-dir=node_modules --exclude-dir=.next || true)
        if [[ -n "$todos" ]]; then
          echo "⚠️ TODO/FIXME comments found:"
          echo "$todos"
          echo "Please address these or create issues for them."
        fi
        
    - name: Check bundle size
      run: |
        pnpm run build
        # Analyze bundle size and fail if too large
        bundle_size=$(du -sh .next | cut -f1)
        echo "Bundle size: $bundle_size"
        
    - name: Run dependency check
      run: pnpm outdated || true
        
    - name: Check for secrets
      if: ${{ github.event.before != github.event.after }}
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: wobbl.ai
        head: HEAD